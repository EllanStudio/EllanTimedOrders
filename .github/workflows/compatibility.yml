name: Build and compatibility matrix

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Paper 26.1 baseline
            api: 26.1.2.build.74-stable
            java: '25'
          - name: Paper 26.3
            api: 26.3.build.157-beta
            java: '25'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - shell: bash
        run: chmod +x gradlew
      - run: ./gradlew clean build --no-daemon -PpaperApiVersion=${{ matrix.api }}
